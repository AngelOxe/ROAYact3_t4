<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de materias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 1050px;
            margin: 45px auto;
            padding: 0 20px;
        }

        header {
            background: #16324f;
            color: white;
            padding: 28px;
            border-radius: 14px;
            margin-bottom: 24px;
        }

        header h1 {
            margin: 8px 0;
        }

        header p {
            color: #dbeafe;
            line-height: 1.5;
        }

        .etiqueta {
            font-size: 13px;
            letter-spacing: 2px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 18px #16324f12;
        }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .barra h2 {
            margin: 0;
        }

        .boton {
            display: inline-block;
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            font: inherit;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .principal {
            background: #1d4ed8;
            color: white;
        }

        .editar {
            background: #e0e7ff;
            color: #273d8a;
        }

        .eliminar {
            background: #fee2e2;
            color: #991b1b;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #475569;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .area {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e0f2fe;
            color: #075985;
        }

        .acciones {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .acciones form {
            margin: 0;
        }

        .aviso {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .exito {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .vacio {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>
<main>
    <header>
        <span class="etiqueta">GESTIÓN ACADÉMICA</span>
        <h1>Catálogo de materias</h1>
        <p>Administra tus materias y consulta el área a la que pertenecen.</p>
    </header>

    <div th:if="${mensaje}"
         class="aviso exito"
         role="status"
         th:text="${mensaje}">
    </div>

    <div th:if="${error}"
         class="aviso error"
         role="alert"
         th:text="${error}">
    </div>

    <section class="panel">
        <div class="barra">
            <h2>
                Materias registradas
                (<span th:text="${#lists.size(materias)}">0</span>)
            </h2>

            <a th:href="@{/materias/nueva}" class="boton principal">
                + Nueva materia
            </a>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Materia</th>
                    <th scope="col">Área</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(materias)}">
                    <td colspan="4" class="vacio">
                        Todavía no hay materias. Registra la primera.
                    </td>
                </tr>

                <tr th:each="materia : ${materias}">
                    <td th:text="${materia.id}"></td>
                    <td th:text="${materia.nombre}"></td>

                    <td>
                        <span class="area"
                              th:text="${materia.area.nombre}">
                        </span>
                    </td>

                    <td>
                        <div class="acciones">
                            <a class="boton editar"
                               th:href="@{/materias/{id}/editar(id=${materia.id})}">
                                Editar
                            </a>

                            <form method="post"
                                  th:action="@{/materias/{id}/eliminar(id=${materia.id})}"
                                  onsubmit="return confirm('¿Deseas eliminar esta materia?');">
                                <button type="submit" class="boton eliminar">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        Actividad 3 · Ángel Yibán Ruiz Osante
    </footer>
</main>
</body>
</html>
